plugins {
    id "com.android.application"
    id "kotlin-android"
    // Add the Google Services Gradle plugin
    id "com.google.gms.google-services"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "lk.iit.frontend"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
        freeCompilerArgs += ["-Xno-param-assertions", "-Xno-call-assertions"]
    }

    defaultConfig {
        applicationId = "lk.iit.frontend"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

dependencies {
    // Import the Firebase BoM to manage versions
    implementation platform('com.google.firebase:firebase-bom:33.9.0')
    // Add Firebase Authentication
    implementation 'com.google.firebase:firebase-auth'
    // Optional: Add Firebase Analytics or other SDKs if desired
    implementation 'com.google.firebase:firebase-analytics'
}

flutter {
    source = "../.."
}