name: frontend
description: "Medical app for OCD patients"
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1
environment:
  sdk: ^3.6.0
dependencies:
  flutter:
    sdk: flutter
  # Custom git dependencies
  pie_timer:
    git:
      url: https://github.com/sehansi-9/pie_timer.git
      ref: main
  duration_time_picker:
    git:
      url: https://github.com/sehansi-9/duration_time_picker.git
      ref: master
  # UI and feature dependencies
  cupertino_icons: ^1.0.8
  rive: ^0.13.20
  google_fonts: ^4.0.4 # Downgraded to resolve conflict with microphone/http
  image_picker: ^1.1.2
  animated_flip_counter: ^0.3.4
  # Audio and permissions
  microphone: ^0.1.0 # Pins http to ^0.13.6
  just_audio: ^0.9.44
  permission_handler: ^10.4.5
  record: ^5.2.0
  # File system and utilities
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.19.0 # For date formatting
  collection: ^1.19.0 # For utility functions like average()
  http: ^0.13.6 # Pinned to match microphone's requirement
  # Database and security
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cloud_firestore: ^4.17.5
  firebase_core: ^2.32.0
  flutter_secure_storage: ^9.2.4
  encrypt: ^5.0.3
  # Authentication (only email/password)
  firebase_auth: ^4.16.0
  firebase_storage: ^11.6.1
  # Removed social auth dependencies as per auth branch comment
  # google_sign_in: ^6.2.2
  # flutter_facebook_auth: ^6.0.3
  # sign_in_with_apple: ^5.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.8
flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/animations/
    - assets/sounds/